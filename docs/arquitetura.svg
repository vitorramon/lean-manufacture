  <!-- Base Virtual-Factory -->
  <rect x="30" y="845" width="1860" height="165" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="48" y="877" class="titulo-camada" fill="#004d40">Base Virtual-Factory ao lado (submódulo base/, commit fixado, intocada — ADR-0001); o M3 entra por infra/docker-compose.lean.yml</text>
  <text x="48" y="905" class="det">Perfil reduzido (ADR-0016): mqtt, db, basyx-config, provisioner, aas-env, aas-ui, plc-comm, edge; os outros 19 serviços sobem só com COMPOSE_PROFILES=base-completa.</text>
  <rect x="48" y="922" width="260" height="70" rx="8" class="base"/><text x="62" y="950" class="nome">Godot</text><text x="62" y="975" class="det">planta 3D, CLP virtual</text>
  <rect x="325" y="922" width="260" height="70" rx="8" class="base"/><text x="339" y="950" class="nome">Mosquitto</text><text x="339" y="975" class="det">:1883 · :9001 (UNS vf/…)</text>
  <rect x="602" y="922" width="300" height="70" rx="8" class="base"/><text x="616" y="950" class="nome">BaSyx AAS + Web UI</text><text x="616" y="975" class="det">:8091 · :3001</text>
  <rect x="919" y="922" width="330" height="70" rx="8" class="base"/><text x="933" y="950" class="nome">plc-comm (OPC UA do CLP)</text><text x="933" y="975" class="det">:4840 · :4841, inalterado</text>
  <rect x="1266" y="922" width="300" height="70" rx="8" class="base"/><text x="1280" y="950" class="nome">edge</text><text x="1280" y="975" class="det">CLP → OPC UA → MQTT</text>
  <rect x="1583" y="922" width="290" height="70" rx="8" class="base"/><text x="1597" y="950" class="nome">Historian, MES, ERP…</text><text x="1597" y="975" class="det">só na pilha completa</text>

