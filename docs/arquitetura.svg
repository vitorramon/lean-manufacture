  <!-- L2 -->
  <rect x="505" y="165" width="290" height="115" rx="8" class="base"/>
  <text x="520" y="194" class="nome">Broker MQTT</text>
  <text x="520" y="218" class="det">Mosquitto do Virtual-Factory</text>
  <text x="520" y="244" class="porta">:1883 · dev/v1/…</text>
  <text x="520" y="267" class="det">(UNS vf/… ao lado, intocado)</text>

  <rect x="505" y="345" width="290" height="140" rx="8" class="nosso"/>
  <text x="520" y="374" class="nome">device-gateway</text>
  <text x="520" y="398" class="det">MQTT → OPC UA</text>
  <text x="520" y="424" class="porta">OPC UA :4850</text>
  <text x="520" y="450" class="det">timestamp só aqui; dado</text>
  <text x="520" y="472" class="det">inválido → rejeitados</text>

  <rect x="505" y="550" width="290" height="120" rx="8" class="nosso"/>
  <text x="520" y="579" class="nome">aas-sync</text>
  <text x="520" y="603" class="det">cliente OPC UA</text>
  <text x="520" y="627" class="det">único escritor do</text>
  <text x="520" y="650" class="det">SQLite e do AAS</text>

