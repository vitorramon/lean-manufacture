  <!-- L1 -->
  <rect x="845" y="400" width="260" height="140" rx="8" class="nosso"/>
  <text x="860" y="429" class="nome">SQLite (WAL)</text>
  <text x="860" y="454" class="det">leituras · eventos</text>
  <text x="860" y="477" class="det">sessoes · rejeitados</text>
  <text x="860" y="502" class="det">DB_PATH</text>
  <text x="860" y="524" class="det">(ex.: dados/dados.f4.db)</text>

