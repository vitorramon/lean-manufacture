  <rect x="0" y="0" width="1920" height="1120" fill="#ffffff"/>
  <text x="40" y="44" font-size="30" font-weight="bold" fill="#102027">Arquitetura do M3 — Linha de celulares 4.0 (Grupo 7, Cenário 08)</text>
  <text x="40" y="74" class="sub" font-size="17">Todos os dispositivos são emulados (ADR-0002) · só a L0 troca: L2–L4 não sabem de onde veio o dado · timestamp só no gateway · aas-sync é o único escritor · páginas só leem pelo nucleo</text>

  <!-- Camadas -->
  <rect x="30" y="95" width="440" height="730" rx="10" class="camada"/>
  <text x="48" y="125" class="titulo-camada">L0 — Física (única que troca)</text>
  <rect x="490" y="95" width="320" height="730" rx="10" class="camada"/>
  <text x="508" y="125" class="titulo-camada">L2 — Integração</text>
  <rect x="830" y="95" width="290" height="730" rx="10" class="camada"/>
  <text x="848" y="125" class="titulo-camada">L1 — Dados</text>
  <rect x="1140" y="95" width="380" height="730" rx="10" class="camada"/>
  <text x="1158" y="125" class="titulo-camada">L3 — Serviço</text>
  <rect x="1540" y="95" width="350" height="730" rx="10" class="camada"/>
  <text x="1558" y="125" class="titulo-camada">L4 — Decisão</text>

  <!-- L0: fontes de estímulo -->
  <text x="48" y="152" class="sub">estímulo (--fonte)</text>
  <rect x="45" y="165" width="190" height="105" rx="8" class="base"/>
  <text x="58" y="192" class="nome">Planta Godot</text>
  <text x="58" y="215" class="det">Virtual-Factory,</text>
  <text x="58" y="236" class="det">sem janela · godot</text>
  <text x="58" y="257" class="det">(demonstração)</text>

  <rect x="45" y="300" width="190" height="90" rx="8" class="nosso"/>
  <text x="58" y="327" class="nome">Operador</text>
  <text x="58" y="350" class="det">bancada virtual,</text>
  <text x="58" y="371" class="det">código OP1</text>

  <rect x="45" y="420" width="190" height="90" rx="8" class="sintetico"/>
  <text x="58" y="447" class="nome">Roteiro / teste</text>
  <text x="58" y="470" class="det">sintético, nunca</text>
  <text x="58" y="491" class="det">medição (ADR-0013)</text>

  <!-- L0: dispositivos -->
  <text x="262" y="152" class="sub">dispositivos dev/v1</text>
  <rect x="262" y="165" width="195" height="190" rx="8" class="nosso"/>
  <text x="275" y="192" class="nome">Emulador</text>
  <text x="275" y="214" class="nome">de dispositivos</text>
  <text x="275" y="240" class="det">Python · 4 no trecho:</text>
  <text x="275" y="263" class="det">esp32-bat01 (botão)</text>
  <text x="275" y="285" class="det">qr-entrada</text>
  <text x="275" y="307" class="det">qr-teste</text>
  <text x="275" y="329" class="det">qr-saida</text>

  <rect x="262" y="420" width="195" height="105" rx="8" class="nosso"/>
  <text x="275" y="447" class="nome">Firmware ESP32</text>
  <text x="275" y="470" class="det">no QEMU da Espressif</text>
  <text x="275" y="491" class="det">(ADR-0021)</text>
  <text x="275" y="512" class="det">· firmware</text>

  <rect x="262" y="580" width="195" height="90" rx="8" class="futuro"/>
  <text x="275" y="607" class="nome">ESP32 real</text>
  <text x="275" y="630" class="det">futuro (tarefa 5.6)</text>
  <text x="275" y="651" class="det">· hardware</text>

