  <rect x="1155" y="150" width="350" height="105" rx="8" class="nosso"/>
  <text x="1170" y="178" class="nome">Simulador do M2 (SimPy)</text>
  <text x="1170" y="202" class="det">submódulo simulador/, só leitura;</text>
  <text x="1170" y="224" class="det">subprocesso com cache e tempo</text>
  <text x="1170" y="246" class="det">limite (what-if, Simulado)</text>

  <rect x="1155" y="300" width="350" height="150" rx="8" class="nosso"/>
  <text x="1170" y="328" class="nome">nucleo/</text>
  <text x="1170" y="352" class="det">única porta de leitura (dados.py)</text>
  <text x="1170" y="375" class="det">KPIs, fichas, regras.py (Andon,</text>
  <text x="1170" y="398" class="det">baseline/meta do M1 em</text>
  <text x="1170" y="421" class="det">config/andon.yaml), 3 gerações,</text>
  <text x="1170" y="444" class="det">what-if</text>

  <rect x="1155" y="500" width="350" height="120" rx="8" class="nosso"/>
  <text x="1170" y="528" class="nome">twin-t2t</text>
  <text x="1170" y="553" class="porta">OPC UA :4851</text>
  <text x="1170" y="577" class="det">EstadoGemeo.* e Cadeia.*;</text>
  <text x="1170" y="600" class="det">cliente da cadeia com reconexão</text>

  <rect x="1155" y="675" width="350" height="140" rx="8" class="emulado"/>
  <text x="1170" y="708" class="nome">Elos da cadeia — EMULADOS</text>
  <text x="1170" y="732" class="porta">Fornecedor :4852</text>
  <text x="1170" y="756" class="porta">Distribuição :4853</text>
  <text x="1170" y="782" class="det">emulados por nós enquanto não</text>
  <text x="1170" y="802" class="det">houver grupo parceiro (P-04)</text>

  <path class="fluxo" d="M1330,255 L1330,298"/>
  <path class="fluxo" d="M1105,455 C1130,455 1130,390 1153,390"/>
