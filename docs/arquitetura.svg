  <text x="1570" y="219" class="porta">:8501</text>
  <text x="1570" y="250" class="det">• Visão geral (Andon M1</text>
  <text x="1570" y="272" class="det">   e Andon do posto)</text>
  <text x="1570" y="298" class="det">• Rastreio (ficha da peça)</text>
  <text x="1570" y="324" class="det">• Dispositivos</text>
  <text x="1570" y="350" class="det">• Cadeia (lê a :4851)</text>
  <text x="1570" y="376" class="det">• 3 gerações</text>
  <text x="1570" y="402" class="det">• What-if</text>
  <text x="1570" y="436" class="det">verde · amarelo · vermelho</text>
  <text x="1570" y="458" class="det">· cinza (sem dado / sintético)</text>

  <rect x="1555" y="600" width="320" height="105" rx="8" class="base"/>
  <text x="1570" y="628" class="nome">AAS Web UI :3001</text>
  <text x="1570" y="652" class="det">visão de engenharia (base);</text>
  <text x="1570" y="675" class="det">Grafana só no perfil</text>
  <text x="1570" y="697" class="det">base-completa</text>

