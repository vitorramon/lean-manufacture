[project]
name = "lean-app"
version = "0.1.0"
description = "Dashboard (L3/L4): nucleo (única porta de leitura do SQLite, regras do Andon) e páginas Streamlit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncua>=2.1.0",
    "lean-contrato",
    "pandas>=3.1.1",
    "pyyaml>=6.0",
    "simpy>=4.1.1,<5",
    "streamlit>=1.67.0",
]

[tool.uv.sources]
lean-contrato = { path = "../pipeline/contrato", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.hatch.build.targets.wheel]
packages = ["nucleo"]

[tool.ruff]
line-length = 120
