# Roteiro do trecho COM o posto Teste (tarefas 2.8 e 2.10). DADOS SINTÉTICOS, escritos à mão: servem a
# desenvolvimento, testes e demonstração; nunca a medição nem a estatística (ADR-0013, origem emulador:roteiro).
#
#   uv run --project hardware/emulador emulador --fonte roteiro \
#       --dispositivo qr-entrada,esp32-bat01,qr-teste,qr-saida \
#       --roteiro hardware/emulador/roteiros/trecho-qr-teste-demo.yaml --velocidade 10
#   python3 start.py --fonte roteiro      # usa este roteiro e estes 4 dispositivos por padrão
#
# É o trecho-qr-demo.yaml (tarefa 2.2) com a MESMA linha do tempo e, antes de cada primeira saída, a leitura no
# posto Teste (leitor qr-teste, ponto teste, campo `resultado` do ADR-0026) 6 s antes. Casos a mais:
#   - P0004: reprovada no teste (resultado 0)                       -> evento `teste` valor 0
#   - P0006: lida 2 vezes no teste com 0,3 s                         -> 1 evento `teste`, 1 descarte
#   - P0007: nunca chega ao teste nem à saída (peça esquecida)
# Esperado (além do roteiro de origem): 10 scans de teste, 9 peças com resultado (8 aprovadas, 1 reprovada):
# FPY de TESTE = 8/9, que não é medição e não entra na geração Medido (M3).
descricao: "trecho com posto Teste: 10 peças P0001-P0010, resultado por peça, repetições e uma peça esquecida (sintético)"
dispositivos: [qr-entrada, esp32-bat01, qr-teste, qr-saida]
fim_apos_s: 2
telemetria:
  temperatura: [24.6, 24.8, 25.1, 24.9]
passos:
  - {apos_s: 2, dispositivo: qr-entrada, scan: P0001, ponto: entrada}            # P0001 chega ao posto Bateria
  - {apos_s: 0.6, dispositivo: esp32-bat01, ciclo: inicio}
  - {apos_s: 27.4, dispositivo: esp32-bat01, ciclo: fim}                         # dur_s = 27.4
  - {apos_s: 1.5, dispositivo: qr-entrada, scan: P0002, ponto: entrada}          # P0002 chega ao posto Bateria
  - {apos_s: 0.2, dispositivo: qr-entrada, scan: P0002, ponto: entrada}          # repetição: a câmera lê o mesmo código em quadros seguidos
  - {apos_s: 0.2, dispositivo: qr-entrada, scan: P0002, ponto: entrada}          # repetição
  - {apos_s: 0.2, dispositivo: esp32-bat01, ciclo: inicio}
  - {apos_s: 6, dispositivo: qr-teste, scan: P0001, ponto: teste, resultado: 1}  # P0001 no posto Teste (aprovada)
  - {apos_s: 5.9, dispositivo: qr-saida, scan: P0001, ponto: saida}             # P0001 sai do trecho
  - {apos_s: 14.9, dispositivo: esp32-bat01, ciclo: fim}                         # dur_s = 26.8
  - {apos_s: 1.5, dispositivo: qr-entrada, scan: P0003, ponto: entrada}          # P0003 chega ao posto Bateria
  - {apos_s: 0.6, dispositivo: esp32-bat01, ciclo: inicio}
  - {apos_s: 6, dispositivo: qr-teste, scan: P0002, ponto: teste, resultado: 1}  # P0002 no posto Teste (aprovada)
  - {apos_s: 5.9, dispositivo: qr-saida, scan: P0002, ponto: saida}             # P0002 sai do trecho
  - {apos_s: 16, dispositivo: esp32-bat01, ciclo: fim}                           # dur_s = 27.9
  - {apos_s: 1.5, dispositivo: qr-entrada, scan: P0004, ponto: entrada}          # P0004 chega ao posto Bateria
  - {apos_s: 0.6, dispositivo: esp32-bat01, ciclo: inicio}
  - {apos_s: 6, dispositivo: qr-teste, scan: P0003, ponto: teste, resultado: 1}  # P0003 no posto Teste (aprovada)
  - {apos_s: 5.9, dispositivo: qr-saida, scan: P0003, ponto: saida}             # P0003 sai do trecho
  - {apos_s: 14.6, dispositivo: esp32-bat01, ciclo: fim}                         # dur_s = 26.5
  - {apos_s: 1.5, dispositivo: qr-entrada, scan: P0005, ponto: entrada}          # P0005 chega ao posto Bateria
  - {apos_s: 0.6, dispositivo: esp32-bat01, ciclo: inicio}
  - {apos_s: 6, dispositivo: qr-teste, scan: P0004, ponto: teste, resultado: 0}  # P0004 no posto Teste (reprovada)
  - {apos_s: 5.9, dispositivo: qr-saida, scan: P0004, ponto: saida}             # P0004 sai do trecho
  - {apos_s: 16.4, dispositivo: esp32-bat01, ciclo: fim}                         # dur_s = 28.3
  - {apos_s: 1.5, dispositivo: qr-entrada, scan: P0006, ponto: entrada}          # P0006 chega ao posto Bateria
  - {apos_s: 0.6, dispositivo: esp32-bat01, ciclo: inicio}
  - {apos_s: 6, dispositivo: qr-teste, scan: P0005, ponto: teste, resultado: 1}  # P0005 no posto Teste (aprovada)
  - {apos_s: 5.9, dispositivo: qr-saida, scan: P0005, ponto: saida}             # P0005 sai do trecho
  - {apos_s: 0.5, dispositivo: qr-saida, scan: P0005, ponto: saida}              # repetição imediata na saída
  - {apos_s: 14.7, dispositivo: esp32-bat01, ciclo: fim}                         # dur_s = 27.1
  - {apos_s: 1.5, dispositivo: qr-entrada, scan: P0007, ponto: entrada}          # P0007 chega ao posto Bateria
  - {apos_s: 0.6, dispositivo: esp32-bat01, ciclo: inicio}
  - {apos_s: 6, dispositivo: qr-teste, scan: P0006, ponto: teste, resultado: 1}  # P0006 no posto Teste (aprovada)
  - {apos_s: 0.3, dispositivo: qr-teste, scan: P0006, ponto: teste, resultado: 1}  # repetição no teste
  - {apos_s: 5.6, dispositivo: qr-saida, scan: P0006, ponto: saida}             # P0006 sai do trecho
  - {apos_s: 15, dispositivo: esp32-bat01, ciclo: fim}                           # dur_s = 26.9
  - {apos_s: 1.5, dispositivo: qr-entrada, scan: P0008, ponto: entrada}          # P0008 chega ao posto Bateria
  - {apos_s: 0.6, dispositivo: esp32-bat01, ciclo: inicio}
  - {apos_s: 27.6, dispositivo: esp32-bat01, ciclo: fim}                         # dur_s = 27.6
  - {apos_s: 1.5, dispositivo: qr-entrada, scan: P0009, ponto: entrada}          # P0009 chega ao posto Bateria
  - {apos_s: 0.6, dispositivo: esp32-bat01, ciclo: inicio}
  - {apos_s: 6, dispositivo: qr-teste, scan: P0008, ponto: teste, resultado: 1}  # P0008 no posto Teste (aprovada)
  - {apos_s: 5.9, dispositivo: qr-saida, scan: P0008, ponto: saida}             # P0008 sai do trecho
  - {apos_s: 10, dispositivo: qr-saida, scan: P0008, ponto: saida}               # releitura 10 s depois (dentro da janela de 30 s)
  - {apos_s: 5.3, dispositivo: esp32-bat01, ciclo: fim}                          # dur_s = 27.2
  - {apos_s: 1.5, dispositivo: qr-entrada, scan: P0010, ponto: entrada}          # P0010 chega ao posto Bateria
  - {apos_s: 0.6, dispositivo: esp32-bat01, ciclo: inicio}
  - {apos_s: 6, dispositivo: qr-teste, scan: P0009, ponto: teste, resultado: 1}  # P0009 no posto Teste (aprovada)
  - {apos_s: 5.9, dispositivo: qr-saida, scan: P0009, ponto: saida}             # P0009 sai do trecho
  - {apos_s: 14.8, dispositivo: esp32-bat01, ciclo: fim}                         # dur_s = 26.7
  - {apos_s: 6, dispositivo: qr-teste, scan: P0010, ponto: teste, resultado: 1}  # P0010 no posto Teste (aprovada)
  - {apos_s: 8, dispositivo: qr-saida, scan: P0010, ponto: saida}               # P0010 sai do trecho
