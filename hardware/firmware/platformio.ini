; Firmware do esp32-bat01 (ADR-0003, ADR-0018). Contrato dev/v1: pipeline/contrato/README.md.
;
;   pio run -e esp32        compila o binário da placa (esp32dev, Arduino)
;   pio test -e native      roda os testes da lógica no PC, contra as mensagens de referência do contrato
;   ./emular.sh             compila o ambiente esp32-qemu e roda o firmware no QEMU da Espressif (ADR-0021)
;
; Versões fixadas: plataforma, framework e bibliotecas com versão exata (ADR-0018).

[platformio]
default_envs = esp32

[common]
; ArduinoJson monta os payloads na lógica independente de placa (mesma biblioteca no PC e no ESP32).
lib_deps_logica =
    bblanchon/ArduinoJson@7.2.1

[env:esp32]
platform = platformio/espressif32@6.9.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ${common.lib_deps_logica}
    256dpi/MQTT@2.5.2
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.14
; Camada de hardware da placa: src/hal_esp32.cpp. src/qemu/ (ambiente esp32-qemu) fica fora deste binário.
build_src_filter = +<*> -<qemu/>
; Identidade do dispositivo e origem declarada no status (ADR-0013).
build_flags =
    -DDISPOSITIVO_ID=\"esp32-bat01\"
    -DFW_VERSAO=\"0.1.0\"
    -DFW_ORIGEM=\"hardware\"
; MQTT_HOST/MQTT_PORT do ambiente sobrescrevem os de secrets.h (endereço nunca fixo no código).
extra_scripts = pre:scripts/endereco_broker.py

; Mesmo firmware no QEMU da Espressif (ADR-0021, tarefa 1.8): mesma lógica e mesmo main.cpp; a camada de
; hardware é src/qemu/hal_qemu.cpp (Ethernet OpenCores do QEMU e bancada virtual pela serial). Rodar com ./emular.sh.
[env:esp32-qemu]
extends = env:esp32
build_src_filter = +<*> -<hal_esp32.cpp>
build_flags =
    -DDISPOSITIVO_ID=\"esp32-bat01\"
    -DFW_VERSAO=\"0.1.0\"
    -DFW_ORIGEM=\"firmware:emulado\"
    -DPLACA_QEMU=1
; Driver openeth (src/qemu/openeth, cópia do ESP-IDF 4.4.7): as libs do Arduino saem sem ele. Valores padrão do
; Kconfig do ESP-IDF.
    -DCONFIG_ETH_USE_OPENETH=1
    -DCONFIG_ETH_OPENETH_DMA_RX_BUFFER_NUM=4
    -DCONFIG_ETH_OPENETH_DMA_TX_BUFFER_NUM=1

[env:native]
platform = native@1.2.1
test_framework = unity
lib_deps =
    ${common.lib_deps_logica}
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
; Gera as mensagens de referência do contrato (pipeline/contrato/exemplos) como cabeçalho C++ para os testes.
extra_scripts = pre:scripts/gerar_referencias.py
