[project]
name = "lean-device-gateway"
version = "0.1.0"
description = "device-gateway (L2): MQTT dev/v1 → validação (contrato, faixa, sequência) → timestamp → servidor OPC UA :4850"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncua>=2.1.0",
    "lean-contrato",
    "paho-mqtt>=2.2.0",
]

[tool.uv.sources]
lean-contrato = { path = "../contrato", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/device_gateway"]
