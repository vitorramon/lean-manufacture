[project]
name = "lean-contrato"
version = "1.0.0"
description = "Contrato MQTT dev/v1 dos dispositivos da L0: esquemas JSON, validar(topico, payload) e leitura de config/dispositivos.yaml"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contrato"]
